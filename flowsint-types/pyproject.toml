[project]
name = "flowsint-types"
version = "1.2.11"
description = "Pydantic models for flowsint"
license = "Apache-2.0"
authors = [{ name = "dextmorgn", email = "contact@flowsint.io" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic>=2.0,<3.0",
    "email-validator>=2.0,<3.0",
    "phonenumbers>=9.0,<10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.16,<1.0",
    "mypy>=1.17,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowsint_types"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# See the matching disable's rationale in flowsint-core/pyproject.toml:
# none of the 4 workspace packages ship a py.typed marker, so every
# cross-package import collapses to Any — a workspace-wide gap, not a
# per-file bug.
disable_error_code = ["import-untyped"]
# Without this, mypy doesn't understand Field()'s required/optional
# semantics and flags every pydantic model construction that omits a
# field with a default as a "missing named argument" false positive.
plugins = ["pydantic.mypy"]

# See the matching override's rationale in flowsint-core/pyproject.toml:
# pytest fixture params aren't worth fully annotating for test-only code.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
